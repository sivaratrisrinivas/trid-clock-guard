services:
  - type: web
    name: trid-clock-guard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Optional: set DATABASE_URL to a Postgres URL. Without it the app uses an embedded SQLite file.
